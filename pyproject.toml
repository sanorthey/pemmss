[project]
name = "pemmss"
version = "1.4.1"
authors = [
    {name = "Stephen Northey", email = "stephen.northey@uts.edu.au"},
]
maintainers = [
    {name = "Stephen Northey", email = "stephen.northey@uts.edu.au"}
]
description = "Primary Exploration, Mining and Metal Supply Scenario (PEMMSS) model"
readme = "README.md"
license = "BSD 3-Clause"
license-files = ["LICENSE.md"]
keywords = ["pemmss"]
requires-python = ">=3.12"

dependencies = [
    "anywidget>=0.11.0",
    "charset-normalizer>=3.5.2",
    "geopandas>=1.2.0",
    "imageio>=2.38.1",
    "ipyleaflet>=0.20.0,<0.21",
    "ipywidgets>=8.1.9,<9",
    "matplotlib>=3.11.2,<4",
    "numpy>=2.5.4,<3",
    "pandas>=3.0.6,<4",
    "plotly>=7.1.0,<8",
    "polars>=2.0.0,<3",
    "shapely>=2.2.0,<3",
    "shiny>=1.8.0,<2",
    "shinywidgets>=0.8.2,<0.9",
]

[dependency-groups]
dev = ["pandas-stubs>=3.0.5"]

[project.urls]
Homepage = "https://zenodo.org/records/16792366"
Repository = "https://github.com/sanorthey/pemmss"
Issues = "https://github.com/sanorthey/pemmss/issues"
Changelog = "https://zenodo.org/records/16792366"

